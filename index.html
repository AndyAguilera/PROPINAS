<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propinas · Beraza y Cia SRL</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --line: #e6eaf2; --line2: #f0f2f7;
    --tx: #172033; --tx2: #5d687c; --tx3: #98a2b3;
    --pri: #4f46e5; --pri2: #7c3aed; --pribg: #eef0ff;
    --full: #2563eb; --fullbg: #e8f0ff; --playa: #0d9488; --playabg: #e3f6f3;
    --ok: #059669; --okbg: #e7f8f1; --warn: #b45309; --warnbg: #fff6e5; --err: #dc2626; --errbg: #fdeeee;
    --r: 16px; --r2: 10px;
    --sh: 0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.05);
    --sh2: 0 10px 30px rgba(79,70,229,.18);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.45 "Segoe UI", "Inter", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--tx2); } .small { font-size: 13px; } .tiny { font-size: 12px; } .b { font-weight: 650; }
  .neg { color: var(--err) !important; } .hidden { display: none !important; }

  /* ---------- Estructura */
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
  .logo { display: flex; gap: 11px; align-items: center; padding: 4px 8px 22px; }
  .logo .m { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px; box-shadow: var(--sh2); }
  .logo b { display: block; font-size: 15px; line-height: 1.2; } .logo span { font-size: 12px; color: var(--tx3); }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin: 2px 0; border-radius: 11px; color: var(--tx2); cursor: pointer; font-weight: 550; position: relative; transition: background .2s, color .2s; user-select: none; }
  .nav a svg { width: 19px; height: 19px; flex: none; transition: transform .25s var(--ease); }
  .nav a:hover { background: var(--line2); color: var(--tx); } .nav a:hover svg { transform: scale(1.1); }
  .nav a.on { background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; box-shadow: var(--sh2); }
  .nav .sep { height: 1px; background: var(--line); margin: 10px 8px; }
  .side .foot { margin-top: auto; font-size: 12px; color: var(--tx3); padding: 12px 10px 0; border-top: 1px solid var(--line); line-height: 1.6; }
  .side .foot b { color: var(--tx2); } .side .foot a { color: var(--warn); cursor: pointer; font-weight: 600; }
  .main { min-width: 0; padding: 26px 34px 50px; }
  .head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 26px; letter-spacing: -.3px; } .head .sub { color: var(--tx3); font-size: 14px; margin-top: 2px; }
  .head .acts { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  #view { animation: entrar .35s var(--ease) both; }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .stagger > * { animation: subir .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes subir { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }

  /* ---------- Tarjetas */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); }
  .card .hd { display: flex; align-items: center; gap: 10px; padding: 16px 20px 6px; flex-wrap: wrap; }
  .card .hd h3 { margin: 0; font-size: 15px; } .card .hd .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .card .bd { padding: 12px 20px 18px; } .card .bd.p0 { padding: 0 0 6px; }
  .grid { display: grid; gap: 18px; } .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: 1.25fr 1fr 1fr; } .g21 { grid-template-columns: 1.6fr 1fr; }
  .mt { margin-top: 18px; }
  .hero { position: relative; overflow: hidden; color: #fff; border: 0; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 60%, #a855f7 100%); box-shadow: var(--sh2); padding: 22px 24px; }
  .hero:after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.12); animation: flotar 7s ease-in-out infinite; }
  .hero:before { content: ""; position: absolute; right: 60px; bottom: -80px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); animation: flotar 9s ease-in-out infinite reverse; }
  @keyframes flotar { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-14px, 12px); } }
  .hero .l { opacity: .85; font-size: 14px; } .hero .v { font-size: 40px; font-weight: 750; letter-spacing: -.5px; margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
  .hero .row { display: flex; gap: 26px; position: relative; z-index: 1; flex-wrap: wrap; } .hero .row div span { display: block; font-size: 12px; opacity: .8; } .hero .row b { font-size: 17px; }
  .sect { padding: 18px 20px; position: relative; overflow: hidden; }
  .sect .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .sect .v { font-size: 26px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .sect .l { font-size: 12.5px; color: var(--tx2); }
  .sect .mini { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--tx2); } .sect .mini b { color: var(--tx); font-variant-numeric: tabular-nums; }
  .barra { height: 8px; border-radius: 8px; background: var(--line2); overflow: hidden; margin-top: 12px; }
  .barra i { display: block; height: 100%; width: 0; border-radius: 8px; transition: width 1.1s var(--ease); }
  .FULL .barra i, .barra.FULL i { background: linear-gradient(90deg, #60a5fa, var(--full)); }
  .PLAYA .barra i, .barra.PLAYA i { background: linear-gradient(90deg, #5eead4, var(--playa)); }
  .chip-s { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 750; letter-spacing: .4px; padding: 3px 10px; border-radius: 20px; }
  .chip-s.FULL { background: var(--fullbg); color: var(--full); } .chip-s.PLAYA { background: var(--playabg); color: var(--playa); } .chip-s.otro { background: var(--line2); color: var(--tx2); }
  .chip-s:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* ---------- Controles */
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 18px; }
  .f { display: flex; flex-direction: column; gap: 5px; } .f > label { font-size: 12.5px; color: var(--tx2); font-weight: 600; }
  .f input, .f select, .f textarea { height: 42px; border: 1.5px solid var(--line); border-radius: var(--r2); padding: 0 12px; background: #fff; transition: border-color .2s, box-shadow .2s; min-width: 120px; }
  .f textarea { height: auto; padding: 10px 12px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--pri) !important; box-shadow: 0 0 0 4px rgba(79,70,229,.12); }
  .f.grow { flex: 1; min-width: 200px; } .f.grow input { width: 100%; }
  input[type=checkbox] { width: 18px; height: 18px; min-width: 0 !important; accent-color: var(--pri); cursor: pointer; margin: 0; }
  .check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; height: 42px; }
  /* control segmentado con indicador deslizante */
  .seg { position: relative; display: inline-flex; background: #e9ecf3; border-radius: 12px; padding: 4px; height: 44px; }
  .seg button { position: relative; z-index: 1; border: 0; background: none; padding: 0 18px; cursor: pointer; border-radius: 9px; font-weight: 600; color: var(--tx2); transition: color .25s; white-space: nowrap; }
  .seg button.on { color: var(--tx); }
  .seg .ind { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 9px; background: #fff; box-shadow: 0 2px 8px rgba(16,24,40,.12); transition: transform .35s var(--ease), width .35s var(--ease); }
  .seg.big { height: 52px; } .seg.big button { padding: 0 26px; font-size: 16px; }
  .seg.sec button.on[data-v=FULL] { color: var(--full); } .seg.sec button.on[data-v=PLAYA] { color: var(--playa); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 22px; padding: 7px 14px; font-size: 13.5px; cursor: pointer; font-weight: 550; transition: all .2s var(--ease); }
  .chip:hover { border-color: var(--pri); color: var(--pri); transform: translateY(-1px); }
  .chip.on { background: var(--pri); border-color: var(--pri); color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,.25); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 11px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-weight: 650; white-space: nowrap; transition: transform .15s var(--ease), box-shadow .2s, background .2s, border-color .2s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16,24,40,.08); border-color: #cfd5e2; }
  .btn:active { transform: translateY(0) scale(.97); } .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn svg { width: 18px; height: 18px; }
  .btn.pri { border: 0; color: #fff; background: linear-gradient(135deg, var(--pri), var(--pri2)); box-shadow: 0 6px 16px rgba(79,70,229,.28); }
  .btn.pri:hover { box-shadow: 0 10px 24px rgba(79,70,229,.36); }
  .btn.wa { border: 0; color: #fff; background: linear-gradient(135deg, #22c55e, #128c4a); box-shadow: 0 6px 16px rgba(18,140,74,.28); }
  .btn.dan { color: var(--err); border-color: #f4c7c7; } .btn.dan.s { background: var(--err); color: #fff; border-color: var(--err); }
  .btn.lg { height: 54px; padding: 0 28px; font-size: 16px; border-radius: 14px; }
  .btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--pri); } .btn.ghost:hover { background: var(--pribg); box-shadow: none; }
  .iconbtn { width: 42px; padding: 0; }

  /* ---------- Listas y tablas */
  .tw { overflow: auto; } .maxh { max-height: 62vh; }
  table.t { width: 100%; border-collapse: collapse; }
  .t th { position: sticky; top: 0; background: #fff; z-index: 1; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--tx3); font-weight: 700; padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .t th.num { text-align: right; }
  .t td { padding: 11px 16px; border-bottom: 1px solid var(--line2); }
  .t tbody tr { transition: background .15s; } .t tr.click { cursor: pointer; } .t tr.click:hover td { background: #f8f9fe; }
  .t tfoot td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 0; }
  .t .sel td { background: #f5f5ff; }
  .empty { text-align: center; color: var(--tx3); padding: 36px 20px; } .empty .ic { font-size: 34px; margin-bottom: 8px; animation: rebote 2s ease-in-out infinite; } .empty b { display: block; color: var(--tx2); font-size: 15px; margin-bottom: 4px; }
  @keyframes rebote { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .pill { display: inline-block; font-size: 12px; font-weight: 650; padding: 3px 10px; border-radius: 20px; background: var(--line2); color: var(--tx2); }
  .pill.ok { background: var(--okbg); color: var(--ok); } .pill.warn { background: var(--warnbg); color: var(--warn); } .pill.err { background: var(--errbg); color: var(--err); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 750; flex: none; }
  .avatar.FULL { background: var(--fullbg); color: var(--full); } .avatar.PLAYA { background: var(--playabg); color: var(--playa); }
  .persona { display: flex; align-items: center; gap: 12px; } .persona .n { font-weight: 600; } .persona .lg { font-size: 12px; color: var(--tx3); }
  .rank li { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 20px; align-items: center; }
  .rank { margin: 0; padding: 0; } .rank .barra { grid-column: 1 / -1; margin-top: 2px; height: 6px; }
  .banner { padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; animation: subir .4s var(--ease) both; }
  .banner.info { background: var(--pribg); color: #3730a3; } .banner.warn { background: var(--warnbg); color: #7c3d06; } .banner.ok { background: var(--okbg); color: #065f46; } .banner.err { background: var(--errbg); color: #991b1b; }

  /* ---------- Últimos días */
  .dias7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .dias7 .slot { padding: 9px 10px; } .dias7 .slot .v { font-size: 14px; white-space: nowrap; }
  .slot.hoy { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pribg); }
  .billetes { display: flex; flex-wrap: wrap; gap: 8px; } .billetes span { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; border-radius: 9px; padding: 5px 10px; font-weight: 700; font-size: 13px; }
  .bil { display: block; font-size: 11px; color: var(--tx3); margin-top: 3px; white-space: nowrap; }
  .slot { border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; transition: all .2s var(--ease); }
  .slot:hover { border-color: var(--pri); transform: translateY(-2px); }
  .slot .t { font-size: 13px; color: var(--tx2); font-weight: 600; } .slot .v { font-weight: 700; margin-top: 2px; }
  .slot.ok { border-style: solid; border-color: transparent; background: var(--okbg); } .slot.ok .v { color: var(--ok); }
  .slot .v.no { color: var(--tx3); font-weight: 550; }

  /* ---------- Cargar propinas */
  .cargar-top { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
  .fecha { display: flex; align-items: center; gap: 6px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 4px; height: 52px; }
  .fecha button { border: 0; background: none; width: 40px; height: 42px; border-radius: 9px; cursor: pointer; font-size: 16px; transition: background .2s; } .fecha button:hover { background: var(--line2); }
  .fecha input { border: 0; height: 42px; font-weight: 600; background: none; } .fecha input:focus { box-shadow: none; }
  .fecha .dia { font-size: 13px; color: var(--tx2); padding: 0 6px 0 2px; min-width: 74px; }
  .lista { display: grid; gap: 8px; }
  .emp { display: grid; grid-template-columns: 1fr 200px 120px; gap: 14px; align-items: center; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; transition: border-color .2s, box-shadow .2s, transform .2s var(--ease); }
  .emp:focus-within { border-color: var(--pri); box-shadow: 0 6px 18px rgba(79,70,229,.12); transform: translateX(3px); }
  .emp.tiene { border-color: #c9e9dc; background: linear-gradient(90deg, #fff, #f6fcf9); }
  .emp input { height: 46px; text-align: right; font-size: 18px; font-weight: 650; border: 1.5px solid var(--line); border-radius: 11px; padding: 0 14px; width: 100%; font-variant-numeric: tabular-nums; transition: all .2s; }
  .emp input::placeholder { color: #c5cbd6; font-weight: 400; }
  .emp input.chg { border-color: #f59e0b; background: #fffbeb; } .emp input.bad { border-color: var(--err); background: var(--errbg); animation: sacudir .35s; }
  @keyframes sacudir { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
  .emp .ant { font-size: 12.5px; color: var(--tx3); text-align: right; }
  .totbar { position: sticky; bottom: 14px; z-index: 5; margin-top: 16px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding: 14px 18px; border-radius: 18px; background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(16,24,40,.12); }
  .totbar .l { font-size: 12.5px; color: var(--tx2); } .totbar .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; transition: transform .2s; }
  .totbar .v.pop { animation: pop .3s var(--ease); }
  @keyframes pop { 50% { transform: scale(1.08); } }
  .totbar .acts { margin-left: auto; display: flex; gap: 10px; }
  .t input.amt { width: 140px; height: 40px; text-align: right; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 10px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .t input.amt.bad { border-color: var(--err); background: var(--errbg); }
  .exc { display: grid; gap: 6px; margin-top: 8px; } .exc input[type=text] { height: 36px; border: 1.5px solid #f4c7c7; border-radius: 9px; padding: 0 10px; width: 100%; }

  /* ---------- Reportes */
  .tipos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .tipo { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; transition: all .25s var(--ease); }
  .tipo:hover { transform: translateY(-3px); box-shadow: var(--sh); }
  .tipo .e { font-size: 22px; } .tipo b { display: block; margin-top: 4px; } .tipo span { font-size: 12.5px; color: var(--tx3); }
  .tipo.on { border-color: var(--pri); background: var(--pribg); box-shadow: 0 8px 20px rgba(79,70,229,.15); }
  .chat { background: #efeae2; background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 14px 14px; border-radius: 14px; padding: 20px; min-height: 300px; }
  .burbuja { position: relative; max-width: 520px; margin-left: auto; background: #d9fdd3; border-radius: 12px 0 12px 12px; padding: 10px 12px 18px; box-shadow: 0 1px 1px rgba(0,0,0,.08); white-space: pre-wrap; word-break: break-word; font: 14.5px/1.5 "Segoe UI", Roboto, Arial, sans-serif; animation: llegar .45s var(--ease) both; }
  .burbuja:after { content: ""; position: absolute; right: -8px; top: 0; border: 8px solid transparent; border-top-color: #d9fdd3; border-left-color: #d9fdd3; border-right: 0; }
  .burbuja .hora { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: #667781; }
  @keyframes llegar { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  .tabs { display: inline-flex; gap: 4px; background: #e9ecf3; border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabs a { padding: 8px 16px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--tx2); transition: all .2s; }
  .tabs a.on { background: #fff; color: var(--tx); box-shadow: 0 2px 8px rgba(16,24,40,.1); }

  /* ---------- Modal, panel lateral, avisos */
  .ov { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.38); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: flex-start; padding: 7vh 16px; overflow: auto; animation: fade .2s both; }
  .ov.out { animation: fadeOut .18s both; } @keyframes fade { from { opacity: 0; } } @keyframes fadeOut { to { opacity: 0; } }
  .modal { background: #fff; border-radius: 20px; width: 100%; max-width: 560px; box-shadow: 0 30px 70px rgba(15,23,42,.3); animation: aparecer .3s var(--ease) both; }
  .modal.lg { max-width: 860px; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
  .modal .mh { padding: 18px 22px 8px; display: flex; align-items: center; } .modal .mh h3 { margin: 0; font-size: 18px; }
  .modal .x { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--line2); cursor: pointer; font-size: 18px; color: var(--tx2); transition: transform .2s; } .modal .x:hover { transform: rotate(90deg); }
  .modal .mbd { padding: 10px 22px 16px; max-height: 68vh; overflow: auto; }
  .modal .mf { padding: 12px 22px 20px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: #fff; z-index: 60; box-shadow: -20px 0 60px rgba(15,23,42,.2); display: flex; flex-direction: column; animation: deslizar .35s var(--ease) both; }
  .drawer.out { animation: deslizarFuera .25s ease-in both; }
  @keyframes deslizar { from { transform: translateX(100%); } } @keyframes deslizarFuera { to { transform: translateX(100%); } }
  .drawer .mh { padding: 20px 22px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .drawer .mbd { padding: 18px 22px; overflow: auto; flex: 1; }
  .kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kv div { background: var(--bg); border-radius: 12px; padding: 10px 12px; } .kv span { display: block; font-size: 12px; color: var(--tx2); } .kv b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .form .full { grid-column: 1/-1; } .form .f input, .form .f select, .form .f textarea { width: 100%; }
  .toasts { position: fixed; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 10px; z-index: 90; }

/* ---------- catálogos */

function persona(m, sub) { return '<div class="persona"><div class="avatar ' + esc(m.s) + '">' + esc(iniciales(m.nombre).toUpperCase()) + '</div><div><div class="n">' + esc(m.nombre) + (m.activo ? '' : ' <span class="pill">inactivo</span>') + '</div>' + (sub !== undefined ? '<div class="lg">' + sub + '</div>' : (m.legajo ? '<div class="lg">Legajo ' + esc(m.legajo) + '</div>' : '')) + '</div></div>'; }

/* ---------- cálculos
 * Cada sector tiene su CAJA (fondo común): saldo inicial + propinas cargadas − entregas.
 * Al entregar, la plata se reparte entre los participantes en proporción a los días trabajados (desde su
 * fecha de ingreso). Para los reportes, lo entregado se descuenta primero de la plata más vieja de la caja.

var memo = { rev: -1 };

function calc() {
  if (memo.rev === REV) return memo;
  var S = {}, P = {}, pagado = {};

  function px(p, s) { var k = bucket(p, s); return P[k] || (P[k] = { k: k, p: p, s: s, propinas: 0, cobrado: 0, cargas: [], cobros: [] }); }
  D.config.sectores.forEach(function (s) { var cf = cajaCfg(s.id), x = sx(s.id); x.inicial = cf.inicial || 0; x.fIni = cf.fecha || ''; });
  Object.keys(D.cargas).forEach(function (k) { var c = D.cargas[k]; if (c.an) return; var x = sx(c.s); x.propinas += c.c; x.items.push(c); var e = px(c.p, c.s); e.propinas += c.c; e.cargas.push(c); });
  D.entregas.forEach(function (en) { if (en.anulada) return; sx(en.s).entregado += en.total; en.items.forEach(function (it) { var e = px(it.p, en.s); e.cobrado += it.c; e.cobros.push({ en: en, it: it }); }); });

    var x = S[k];

    var items = x.items.slice();
    if (x.inicial) items.push({ k: 'INI|' + k, f: x.fIni || '0000-00-00', c: x.inicial, cr: '', ini: true });
    items.sort(function (a, b) { return a.f < b.f ? -1 : a.f > b.f ? 1 : ((b.ini ? 1 : 0) - (a.ini ? 1 : 0)) || (a.cr < b.cr ? -1 : 1); });
    var resto = x.entregado;
    items.forEach(function (c) { var pg = Math.max(0, Math.min(c.c, resto)); pagado[c.k] = pg; resto -= pg; });
    x.ordenados = items;
  });

function cajaDe(s) { var x = calc().S[s]; return x ? x.caja : 0; }
/** Caja de un sector en un período: propinas del período, cuánto de eso ya se entregó y lo pendiente de antes (incluye saldo inicial). */
function resumenSector(s, d, h) {

    else if (c.ini ? (!h || c.f <= h) : (d && c.f < d)) { r.antes += c.c; r.antesPag += pg[c.k] || 0; }

/** Lo que queda sin entregar de la plata con fecha hasta "f" (saldo inicial + propinas). */
function pendienteHasta(s, f) { var x = calc().S[s], pg = calc().pagado; if (!x) return 0; return x.ordenados.reduce(function (a, c) { return a + (!f || c.f <= f ? c.c - (pg[c.k] || 0) : 0); }, 0); }

/** Reparte "monto" (centavos) en proporción a los días. Cada parte se redondea hacia abajo al múltiplo de "redondeo";

function cargasDia(f, s) { s = s || SEC; return Object.keys(D.cargas).map(function (k) { return D.cargas[k]; }).filter(function (c) { return !c.an && c.f === f && c.s === s; }); }
/* ---------- billetes argentinos (en pesos) para redondear y armar los sobres */
var BILLETES = [20000, 10000, 2000, 1000, 500, 200, 100, 50, 20, 10];
/** Desglose en billetes de un importe en centavos: [[billete, cantidad]...] y lo que no se puede dar con billetes. */
function desglose(c) {
  var pesos = Math.floor(Math.max(0, c) / 100), out = [];
  BILLETES.forEach(function (b) { var n = Math.floor(pesos / b); if (n) { out.push([b, n]); pesos -= n * b; } });

}

/* ---------- operaciones */
/** Guarda las propinas de un día: valores = { empleado: centavos | null (vacío = no trabajó / se quita) }. */
function guardarDia(f, valores) {
  var s = SEC, res = { nuevas: 0, modificadas: 0, anuladas: 0, iguales: 0 }, ts = ahora();
  Object.keys(valores).forEach(function (p) {
    var v = valores[p], k = clave(f, s, p), c = D.cargas[k];
    if (v === null) { if (c && !c.an) { c.h.push([ts, c.c, null]); c.an = true; c.md = ts; res.anuladas++; } return; }
    if (!c) { D.cargas[k] = { k: k, f: f, s: s, p: p, c: v, an: false, cr: ts, md: ts, h: [] }; res.nuevas++; return; }
    if (c.an) { c.h.push([ts, null, v]); c.an = false; c.c = v; c.md = ts; res.nuevas++; return; }
    if (c.c === v) { res.iguales++; return; }

  if (res.nuevas + res.modificadas + res.anuladas) {

    guardar();

/** o = { f, s, d, h, monto, redondeo, items:[{p, dias, c, manual}], aut, motivo, nota } */
function registrarEntrega(o) {
  var items = (o.items || []).filter(function (it) { return it.c > 0; });
  if (!items.length) throw new Error('No hay importes para entregar.');
  var vistos = {};

    if (vistos[it.p]) throw new Error('Empleado repetido.'); vistos[it.p] = 1;
    if (!(it.c > 0) || Math.round(it.c) !== it.c) throw new Error(emp(it.p).nombre + ': importe inválido.');
  });

  D.seq.ent++;

  var en = { id: uid('ENT'), n: 'E-' + String(D.seq.ent).padStart(4, '0'), f: o.f, s: o.s || SEC, d: o.d || '', h: o.h || '', monto: o.monto || total, redondeo: o.redondeo || 1, sobrante: sobrante,

function guardarEmpleado(o) {

function tieneMovimientos(id) { return Object.keys(D.cargas).some(function (k) { return D.cargas[k].p === id; }) || D.entregas.some(function (en) { return en.items.some(function (i) { return i.p === id; }); }); }
